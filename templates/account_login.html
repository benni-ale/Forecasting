{% extends "base.html" %}

{% block title %}Login - DollarPunk{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card mt-5">
            <div class="card-header"><i class="bi bi-person-circle"></i> Accedi al tuo account</div>
            <div class="card-body">
                <form method="post" action="{{ url_for('account_login') }}{% if next %}?next={{ next }}{% endif %}">
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Accedi</button>
                </form>
                <hr>
                <p class="text-muted small mb-0">Gli account sono creati dall'amministratore. Senza account puoi comunque usare il portafoglio locale, salvato solo in questo browser.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
